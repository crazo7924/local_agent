[project]
name = "local-agent"
version = "0.1.0"
description = "Self-contained local LLM agent system with FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.124.2",
    "pydantic>=2.0.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.6.1"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
gemini = ["google-genai>=0.1.0"]
all = [
    "ollama>=0.6.1",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
    "pytest>=8.0.0",
]
